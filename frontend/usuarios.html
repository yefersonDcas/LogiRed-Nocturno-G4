<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios · LogiRed</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="encabezado"></header>
  <main class="contenedor">
    <div class="titulo-seccion">
      <div>
        <h1>Usuarios</h1>
        <p class="tenue">Cuentas que pueden entrar a la aplicación (ms-usuarios). Solo el administrador las gestiona.</p>
      </div>
      <button type="button" class="btn primario" id="btn-nuevo" hidden>+ Nuevo usuario</button>
    </div>

    <form id="filtros" class="filtros">
      <label>Rol
        <select name="rol">
          <option value="">Todos</option>
          <option value="administrador">Administrador</option>
          <option value="despacho">Despacho</option>
          <option value="flota">Flota</option>
        </select>
      </label>
      <button type="submit" class="btn">Filtrar</button>
      <button type="reset" class="btn fantasma">Limpiar</button>
    </form>

    <div class="tabla-envoltura">
      <table>
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="col-acciones"></th></tr>
        </thead>
        <tbody id="filas"><tr><td colspan="6" class="vacio">Cargando…</td></tr></tbody>
      </table>
    </div>
  </main>

  <dialog id="dialogo">
    <form id="formulario" novalidate>
      <h2 id="titulo-dialogo">Nuevo usuario</h2>
      <div id="error-form" class="caja-error" hidden></div>
      <label>Nombre completo <input name="nombre" maxlength="150" required></label>
      <label>Correo <input type="email" name="email" maxlength="254" required autocomplete="off"></label>
      <div class="dos-columnas">
        <label>Rol
          <select name="rol" required>
            <option value="">Elige…</option>
            <option value="administrador">Administrador</option>
            <option value="despacho">Despacho</option>
            <option value="flota">Flota</option>
          </select>
        </label>
        <label>Estado
          <select name="activo">
            <option value="true">Activo</option>
            <option value="false">Inactivo (no puede entrar)</option>
          </select>
        </label>
      </div>
      <label><span id="etiqueta-clave">Contraseña</span>
        <input type="password" name="password" autocomplete="new-password">
      </label>
      <p class="tenue" id="ayuda-clave" style="margin:-6px 0 0;font-size:.82rem">ms-usuarios la guarda cifrada (hash); nunca se devuelve.</p>
      <div class="acciones-dialogo">
        <button type="button" class="btn fantasma" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn primario" id="btn-guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/sesion.js"></script>
  <script src="/js/usuarios.js"></script>
</body>
</html>
